services:
  devkit:
    build: .
    image: mindmorass/devkit
    stdin_open: true
    tty: true
    volumes:
      - ./:/home/dev/work
      - /var/run/docker.sock:/var/run/docker.sock
    # Uncomment to run the proxy instead of a shell:
    # command: ["start-proxy"]
    # ports:
    #   - "3128:3128"
    #   - "1080:1080"
    # environment:
    #   PROXY_USER: "u"
    #   PROXY_PASS: "change-me"
    #   ANONYMOUS: "1"
